name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        round:
          - evaluation-1-foundation
          - evaluation-2-intelligence
          - evaluation-3-network
    defaults:
      run:
        working-directory: ${{ matrix.round }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.round }}/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Core, resume, ATS, enrichment and adaptive tests
        run: python -m pytest -q
      - name: Evaluation and red-team tests
        if: matrix.round != 'evaluation-1-foundation'
        run: |
          pip install -r eval/requirements.txt
          python -m pytest eval/tests redteam/tests -q
      - name: Federation tests
        if: matrix.round == 'evaluation-3-network'
        run: python -m pytest federation/tests -q

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Scan for errors
        run: >
          semgrep scan
          --config p/python
          --config p/security-audit
          --config p/owasp-top-ten
          --severity ERROR
          --error
          --metrics=off
          --exclude docs
