<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="refresh" content="3; url=../console/#recruiter">
<title>TR∩ST has moved</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
body { margin: 0; background: var(--bg); color: var(--text); font: 1rem / 1.6 var(--font); }
main { max-width: 560px; margin: 12vh auto; padding: 0 16px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
h1 { font-family: var(--serif); font-size: 1.625rem; margin: 0 0 12px; }
.mark { display: inline-grid; place-items: center; width: 28px; height: 28px; background: var(--accent); color: var(--accent-contrast); border-radius: var(--radius); margin-right: 8px; }
a.go { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; background: var(--accent); color: var(--accent-contrast); border-radius: var(--radius); font-weight: 600; text-decoration: none; }
a.go:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
</style>
</head>
<body>
<main id="main">
  <div class="panel">
    <h1><span class="mark" aria-hidden="true">∩</span>TR∩ST has moved</h1>
    <p>The dashboard is now part of the console. Sign in there to see the overview, the queue and every application in full.</p>
    <p>You will be taken there in 3 seconds. If nothing happens, use the link below.</p>
    <p><a class="go" href="../console/#recruiter">Open the console</a></p>
  </div>
</main>
</body>
</html>
